{% extends "base.html" %}
{% block title %}Restablecer contraseña · VOLTERRA{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="reset-title">
  <h1 id="reset-title">Restablecer contraseña</h1>

  {% if error %}
  <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/reset-password" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="access_token" value="{{ access_token }}">

    <label for="password">Nueva contraseña</label>
    <input id="password" name="password" type="password"
           autocomplete="new-password" required minlength="8">

    <label for="password_confirm">Confirmar contraseña</label>
    <input id="password_confirm" name="password_confirm" type="password"
           autocomplete="new-password" required minlength="8">

    <button type="submit" class="button">Restablecer contraseña</button>
  </form>

  <p class="muted small"><a href="/login">Volver a iniciar sesión</a></p>
</section>
{% endblock %}
