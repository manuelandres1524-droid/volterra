[project]
name = "volterra-mvp"
version = "0.1.0"
description = "VOLTERRA MVP - FastAPI + Supabase"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.1",
    "python-multipart>=0.0.9",
    "supabase>=2.7.4",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

# No build system - Vercel runs the app directly from source
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
